<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Monitoring Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/custom.css" />
  <script defer src="js/app.js"></script>
</head>
<body>
  <header class="glass-header">
    <h1>URL Monitoring System</h1>
    <button id="theme-toggle" aria-label="Toggle dark mode">🌓</button>
  </header>

  <main class="container">
    <!-- Statistics Cards -->
    <section class="stats-grid">
      <div class="card glass-card" id="total-sites">
        <h2>Total Sites</h2>
        <p class="value">0</p>
      </div>
      <div class="card glass-card" id="up-sites">
        <h2>Up</h2>
        <p class="value">0</p>
      </div>
      <div class="card glass-card" id="down-sites">
        <h2>Down</h2>
        <p class="value">0</p>
      </div>
      <div class="card glass-card" id="fastest-site">
        <h2>Fastest</h2>
        <p class="value">-</p>
      </div>
      <div class="card glass-card" id="slowest-site">
        <h2>Slowest</h2>
        <p class="value">-</p>
      </div>
    </section>

    <!-- Action Bar -->
    <section class="action-bar">
      <input type="text" id="new-url" placeholder="https://example.com" />
      <button id="add-website">Add Website</button>
      <input type="text" id="search" placeholder="Search…" />
    </section>

    <!-- Websites Table -->
    <section class="table-wrapper">
      <table class="glass-table" id="sites-table">
        <thead>
          <tr>
            <th>Website</th>
            <th>Status</th>
            <th>Last Checked</th>
            <th>Response Time (ms)</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- History Modal -->
  <div class="modal" id="history-modal" aria-hidden="true">
    <div class="modal-content glass-modal">
      <button class="close-modal" aria-label="Close">✖</button>
      <h2>Monitoring History</h2>
      <ul id="history-list"></ul>
    </div>
  </div>
</body>
</html>
