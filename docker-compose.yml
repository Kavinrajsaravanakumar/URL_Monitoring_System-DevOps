services:
  # ── Node.js Application ─────────────────────
  app:
    build: .
    container_name: url-monitor-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/urlmonitor
      - CRON_SCHEDULE=* * * * *
      - CHECK_TIMEOUT=10000
    depends_on:
      - mongo
    networks:
      - monitor-network

  # ── MongoDB Database ────────────────────────
  mongo:
    image: mongo:7
    container_name: url-monitor-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - monitor-network

# ── Volumes ─────────────────────────────────
volumes:
  mongo-data:
    driver: local

# ── Networks ────────────────────────────────
networks:
  monitor-network:
    driver: bridge
